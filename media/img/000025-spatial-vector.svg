<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" role="img"><title>Vektoren im dreidimensionalen Raum</title><desc>Dreidimensionales Koordinatensystem mit modellhaft gezeichneter Achsenprojektion und Vektor v gleich zwei eins eins.</desc><rect x="0" y="0" width="900" height="630" fill="#ffffff" stroke="none" rx="0" stroke-width="1" /><rect x="18" y="16" width="864" height="594" fill="#ffffff" stroke="#b5c7d8" rx="17" stroke-width="1" /><text x="43" y="51" fill="#253d59" font-size="26" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Vektoren im dreidimensionalen Raum</text><text x="43" y="82" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Ein Ortsvektor mit drei Komponenten</text><line x1="35.00" y1="102.00" x2="865.00" y2="102.00" stroke="#dce5ed" stroke-width="2" stroke-linecap="round" /><line x1="295.00" y1="460.00" x2="580.60" y2="460.00" stroke="#253d59" stroke-width="3" stroke-linecap="round" /><text x="590.5999999999999" y="481.0" fill="#253d59" font-size="20" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">x</text><line x1="295.00" y1="460.00" x2="143.80" y2="352.90" stroke="#253d59" stroke-width="3" stroke-linecap="round" /><text x="127.79999999999998" y="373.9" fill="#253d59" font-size="20" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">y</text><line x1="295.00" y1="460.00" x2="295.00" y2="156.25" stroke="#253d59" stroke-width="3" stroke-linecap="round" /><text x="305.0" y="148.25" fill="#253d59" font-size="20" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">z</text><polyline points="499.00,460.00 427.00,409.00 427.00,274.00 499.00,325.00 499.00,460.00" fill="none" stroke="#b5c7d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" /><polyline points="223.00,409.00 427.00,409.00 499.00,460.00" fill="none" stroke="#b5c7d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" /><line x1="295.00" y1="460.00" x2="427.00" y2="274.00" stroke="#286fba" stroke-width="6" stroke-linecap="round" /><circle cx="427.00" cy="274.00" r="8" fill="#ffffff" stroke="#286fba" stroke-width="3" /><text x="442" y="259" fill="#286fba" font-size="22" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">v = (2, 1, 1)</text><text x="585" y="280" fill="#253d59" font-size="17" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">2 Schritte in x-Richtung</text><text x="585" y="318" fill="#253d59" font-size="17" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">1 Schritt in y-Richtung</text><text x="585" y="356" fill="#253d59" font-size="17" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">1 Schritt in z-Richtung</text><text x="45" y="586" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Die Projektion ist schematisch; die Koordinaten bestimmen den Vektor.</text></svg>